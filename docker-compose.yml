services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bancada_streamlit_app
    init: true
    shm_size: '1gb'
    env_file:
      - .env
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_PORT=${STREAMLIT_PORT:-8501}
      - STREAMLIT_SERVER_PORT=${STREAMLIT_PORT:-8501}
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=true
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=50
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - STREAMLIT_LOGGER_LEVEL=error
      - DB_TYPE=${DB_TYPE:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - "POSTGRES_DB=${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}"
      - "POSTGRES_USER=${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
      - TZ=America/Campo_Grande
      - HOST_IP=${HOST_IP:-localhost}
    volumes:
      # Diretório centralizado de dados (SQLite fallback, dados brutos/tratados/prontos e calendário ICS)
      - ./data:/app/data
      # Pastas de modelos e logs
      - ./models:/app/models
      - ./debug_logs:/app/debug_logs
      # Mapeamento do cofre do keyring (Linux/WSL host -> Docker container)
      - ~/.local/share/python_keyring:/root/.local/share/python_keyring
      # Pastas de uploads locais (cache / arquivos de FAQ no Linux / RedHat)
      - ./uploads:/app/uploads
      # Mapeamento de código e assets para Live-Reload sem necessidade de rebuild
      - ./assets:/app/assets
      - ./src:/app/src
      - ./dashboard.py:/app/dashboard.py
      - ./orquestrador.py:/app/orquestrador.py
      - ./init.py:/app/init.py
      - ./.env:/app/.env
      - ./.env.example:/app/.env.example
      - ./.gitignore:/app/.gitignore:ro
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      - ./tests:/app/tests
      - ./util:/app/util
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${STREAMLIT_PORT:-8501}/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      evolution-api:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: bancada_postgres_db
    environment:
      - "POSTGRES_DB=${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}"
      - "POSTGRES_USER=${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: bancada_evolution_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - "AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no arquivo .env}"
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - "DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_bancada
      - REDIS_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - CONFIG_SESSION_PHONE_CLIENT=Bancada STI
      - LOG_LEVEL=ERROR,WARN,INFO
      - LOG_COLOR=true
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - default

volumes:
  postgres_data:
  evolution_instances:
  evolution_store:
