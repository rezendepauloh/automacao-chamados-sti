services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bancada_streamlit_app
    env_file:
      - .env
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"
    environment:
      - STREAMLIT_PORT=${STREAMLIT_PORT:-8501}
      - STREAMLIT_SERVER_PORT=${STREAMLIT_PORT:-8501}
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_LOGGER_LEVEL=error
      - DB_TYPE=sqlite
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=chamados
      - POSTGRES_USER=bancada_user
      - POSTGRES_PASSWORD=bancada_pass
      - TZ=America/Campo_Grande
      - HOST_IP=${HOST_IP:-localhost}
    volumes:
      # Persistência do banco de dados SQLite local
      - ./chamados.db:/app/chamados.db
      # Pastas de dados e modelos
      - ./01 - Dados Brutos:/app/01 - Dados Brutos
      - ./02 - Dados tratados:/app/02 - Dados tratados
      - ./03 - Dados prontos:/app/03 - Dados prontos
      - ./models:/app/models
      - ./debug_logs:/app/debug_logs
      # Mapeamento do cofre do keyring (Linux/WSL host -> Docker container)
      - ~/.local/share/python_keyring:/root/.local/share/python_keyring
      # Pastas de uploads locais (cache / arquivos de FAQ no Linux / RedHat)
      - ./uploads:/app/uploads
      # Mapeamento de código e assets para Live-Reload sem necessidade de rebuild
      - ./assets:/app/assets
      - ./src:/app/src
      - ./dashboard.py:/app/dashboard.py
      - ./orquestrador.py:/app/orquestrador.py
      - ./init.py:/app/init.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${STREAMLIT_PORT:-8501}/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      - evolution-api

  db:
    image: postgres:15-alpine
    container_name: bancada_postgres_db
    environment:
      - POSTGRES_DB=chamados
      - POSTGRES_USER=bancada_user
      - POSTGRES_PASSWORD=bancada_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancada_user -d chamados"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: bancada_evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-bancada_secret_token_123}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://bancada_user:bancada_pass@db:5432/chamados?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_bancada
      - REDIS_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - CONFIG_SESSION_PHONE_CLIENT=Bancada STI
      - LOG_LEVEL=ERROR,WARN,INFO
      - LOG_COLOR=true
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - default

volumes:
  postgres_data:
  evolution_instances:
  evolution_store:
