services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bancada_streamlit_app
    env_file:
      - .env
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"
    environment:
      - STREAMLIT_PORT=${STREAMLIT_PORT:-8501}
      - STREAMLIT_SERVER_PORT=${STREAMLIT_PORT:-8501}
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_LOGGER_LEVEL=error
      - DB_TYPE=sqlite
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=chamados
      - POSTGRES_USER=bancada_user
      - POSTGRES_PASSWORD=bancada_pass
      - TZ=America/Campo_Grande
      - HOST_IP=${HOST_IP:-localhost}
    volumes:
      # Persistência do banco de dados SQLite local
      - ./chamados.db:/app/chamados.db
      # Pastas de dados e modelos
      - ./01 - Dados Brutos:/app/01 - Dados Brutos
      - ./02 - Dados tratados:/app/02 - Dados tratados
      - ./03 - Dados prontos:/app/03 - Dados prontos
      - ./models:/app/models
      - ./debug_logs:/app/debug_logs
      # Mapeamento do cofre do keyring (Linux/WSL host -> Docker container)
      - ~/.local/share/python_keyring:/root/.local/share/python_keyring
      # Mapeamento de código e assets para Live-Reload sem necessidade de rebuild
      - ./assets:/app/assets
      - ./src:/app/src
      - ./dashboard.py:/app/dashboard.py
      - ./orquestrador.py:/app/orquestrador.py
      - ./init.py:/app/init.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${STREAMLIT_PORT:-8501}/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: bancada_postgres_db
    environment:
      - POSTGRES_DB=chamados
      - POSTGRES_USER=bancada_user
      - POSTGRES_PASSWORD=bancada_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancada_user -d chamados"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
